[package]
name = "workspace-indicator"
version = "0.1.0"
edition = "2024"

[dependencies]
smithay-client-toolkit = { version = "0.20", default-features = false, features = [
  "calloop",
] }
wayland-client = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
